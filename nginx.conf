events {
    worker_connections 1024;
}

http {
    # Configuration du proxy
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;

    # Désactiver les logs d'accès pour les chemins sensibles
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Configuration du serveur
    server {
        listen 80;
        server_name localhost;

        # Désactiver les headers sensibles
        server_tokens off;

        # Configuration du timeout et des tailles de requête
        client_max_body_size 100M;
        client_body_timeout 120s;
        client_header_timeout 120s;

        # Configuration de la compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Endpoint de santé simple
        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # Proxy vers le service n8n
        location / {
            proxy_pass http://n8n-geospatial:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Temps de réponse plus long pour les traitements géospatiaux
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Configuration spécifique pour les webhooks (si utilisés)
        location /webhook {
            proxy_pass http://n8n-geospatial:5678/webhook;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Configuration pour les assets statiques
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://n8n-geospatial:5678;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

