# Render blueprint for deployment
# Notes:
# - Free tier does NOT support persistent disks
# - Secrets marked with sync:false must be set manually in Render dashboard
# - N8N_EDITOR_BASE_URL format: https://<service-name>.onrender.com

services:
  - type: web
    name: n8n-geospatial
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: /startup.sh
    healthCheckPath: /healthz
    envVars:
      # === Authentication ===
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false # Set in Render dashboard

      # === URLs (set manually in dashboard after deploy) ===
      # Format: https://n8n-geospatial.onrender.com
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

      # === Timezone & Locale ===
      - key: GENERIC_TIMEZONE
        value: Africa/Ouagadougou
      - key: TZ
        value: Africa/Ouagadougou
      - key: N8N_DEFAULT_LOCALE
        value: fr

      # === Security Keys (set in dashboard) ===
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_USER_MANAGEMENT_JWT_SECRET
        sync: false
      - key: N8N_ENABLE_EXECUTE_COMMAND
        value: "false"

      # === Database ===
      - key: DB_TYPE
        value: postgresdb
      - key: DATABASE_URL
        fromDatabase:
          name: n8n-postgres
          property: connectionString

      # === Task Runners ===
      - key: N8N_RUNNERS_MODE
        value: external
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_RUNNERS_AUTH_TOKEN
        sync: false

      # === GDAL/QGIS Config ===
      - key: GDAL_CACHEMAX
        value: "512"
      - key: GDAL_NUM_THREADS
        value: ALL_CPUS
      - key: PROJ_NETWORK
        value: "ON"
      - key: QT_QPA_PLATFORM
        value: offscreen

      # === Application Config ===
      - key: ENABLE_AUTO_DEPLOY_WORKFLOWS
        value: "false"
      - key: API_KEY
        sync: false

      # === MCP Server (internal connection) ===
      - key: MCP_SERVER_HOST
        fromService:
          name: mcp-server
          type: pserv
          property: host
      - key: MCP_SERVER_PORT
        value: "5001"

    # NOTE: Disk removed - not supported on free tier
    # Data will be lost on redeploy! Use DATABASE_URL for persistence.

  # Private service for MCP (internal access only)
  - type: pserv
    name: mcp-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 /opt/geoscripts/mcp_server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: n8n-postgres
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: PGPORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: PGUSER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password
      - key: MCP_PORT
        value: "5001"

# Managed PostgreSQL instance
databases:
  - name: n8n-postgres
    plan: starter # Free tier not available for PostgreSQL
    databaseName: n8n
    user: n8n
