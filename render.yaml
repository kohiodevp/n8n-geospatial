# Render blueprint for FREE TIER deployment
# Limitation: Only web services allowed, no private services or workers
# Solution: Run n8n + MCP in the same container

services:
  - type: web
    name: n8n-geospatial
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: /startup.sh
    healthCheckPath: /healthz
    envVars:
      # === Authentication ===
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false

      # === URLs (set in dashboard after first deploy) ===
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

      # === Timezone & Locale ===
      - key: GENERIC_TIMEZONE
        value: Africa/Ouagadougou
      - key: TZ
        value: Africa/Ouagadougou
      - key: N8N_DEFAULT_LOCALE
        value: fr

      # === Security Keys ===
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_USER_MANAGEMENT_JWT_SECRET
        sync: false
      - key: N8N_ENABLE_EXECUTE_COMMAND
        value: "false"

      # === Database ===
      - key: DB_TYPE
        value: postgresdb
      - key: DATABASE_URL
        fromDatabase:
          name: n8n-postgres
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: PGPORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: PGUSER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password

      # === Task Runners ===
      - key: N8N_RUNNERS_MODE
        value: internal
      - key: N8N_RUNNERS_ENABLED
        value: "true"

      # === GDAL/QGIS Config ===
      - key: GDAL_CACHEMAX
        value: "256"
      - key: GDAL_NUM_THREADS
        value: "2"
      - key: PROJ_NETWORK
        value: "ON"
      - key: QT_QPA_PLATFORM
        value: offscreen

      # === MCP Server (same container) ===
      - key: MCP_ENABLED
        value: "true"
      - key: MCP_PORT
        value: "5001"
      - key: MCP_SERVER_URL
        value: "http://127.0.0.1:5001"

      # === Application Config ===
      - key: ENABLE_AUTO_DEPLOY_WORKFLOWS
        value: "false"
      - key: API_KEY
        sync: false

databases:
  - name: n8n-postgres
    plan: free
    databaseName: n8n
    user: n8n
