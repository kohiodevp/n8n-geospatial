# Render blueprint for deployment
# Notes:
# - Uses a single Dockerfile that contains n8n + QGIS + MCP environment
# - Web service for n8n (port 5678), private service for MCP (port 5001)
# - Uses managed PostgreSQL (starter plan - no free tier available)
# - Secrets marked with sync:false must be set manually in Render dashboard

services:
  - type: web
    name: n8n-geospatial
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: /startup.sh
    healthCheckPath: /healthz
    envVars:
      # === Authentication ===
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false # Set in Render dashboard

      # === URLs (auto-resolved from service) ===
      - key: N8N_EDITOR_BASE_URL
        fromService:
          name: n8n-geospatial
          type: web
          property: hostURL
      - key: N8N_WEBHOOK_URL
        fromService:
          name: n8n-geospatial
          type: web
          property: hostURL

      # === Timezone & Locale ===
      - key: GENERIC_TIMEZONE
        value: Africa/Ouagadougou
      - key: TZ
        value: Africa/Ouagadougou
      - key: N8N_DEFAULT_LOCALE
        value: fr

      # === Security Keys (set in dashboard) ===
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_USER_MANAGEMENT_JWT_SECRET
        sync: false
      - key: N8N_ENABLE_EXECUTE_COMMAND
        value: "false"

      # === Database ===
      - key: DB_TYPE
        value: postgresdb
      - key: DATABASE_URL
        fromDatabase:
          name: n8n-postgres
          property: connectionString

      # === Task Runners ===
      - key: N8N_RUNNERS_MODE
        value: external
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_RUNNERS_AUTH_TOKEN
        sync: false

      # === GDAL/QGIS Config ===
      - key: GDAL_CACHEMAX
        value: "512"
      - key: GDAL_NUM_THREADS
        value: ALL_CPUS
      - key: PROJ_NETWORK
        value: "ON"
      - key: QT_QPA_PLATFORM
        value: offscreen

      # === Application Config ===
      - key: ENABLE_AUTO_DEPLOY_WORKFLOWS
        value: "false"
      - key: API_KEY
        sync: false

      # === MCP Server URL (internal) ===
      - key: MCP_SERVER_URL
        fromService:
          name: mcp-server
          type: pserv
          property: hostURL

    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1

  # Private service for MCP (accessible only internally)
  - type: pserv
    name: mcp-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 /opt/geoscripts/mcp_server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: n8n-postgres
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: PGPORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: PGUSER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password
      - key: MCP_PORT
        value: "5001"
    # Optional: persistent disk for cache
    # disk:
    #   name: mcp-cache
    #   mountPath: /tmp/geodata-cache
    #   sizeGB: 1

# Managed PostgreSQL instance
databases:
  - name: n8n-postgres
    plan: starter # Note: free tier no longer available for PostgreSQL
    databaseName: n8n
    user: n8n
    # ipAllowList omitted = private access only (Render internal)
