services:
  # Service principal n8n avec fonctionnalités géospatiales et IA
  n8n-geospatial:
    profiles:
      - dev
      - prod
    build: .
    container_name: n8n-geospatial
    ports:
      - "5678:5678"
    environment:
      # Variables d'environnement provenant du fichier .env
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-cadastre2024}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}

      # Configuration de la base de données PostGIS
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgis
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8npassword}
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_SSL_ENABLED=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-n8n}:${POSTGRES_PASSWORD:-n8npassword}@postgis:5432/${POSTGRES_DB:-n8n}

      # Configuration des runners pour le traitement géospatial
      - N8N_RUNNERS_MODE=${N8N_RUNNERS_MODE:-external}
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-your_secure_runner_auth_token_here}
      - QUEUE_HEALTH_CHECK_ACTIVE=true

      # Configuration des fonctions et sécurité
      - N8N_ENABLE_EXECUTE_COMMAND=${N8N_ENABLE_EXECUTE_COMMAND:-true}
      - NODE_FUNCTION_ALLOW_EXTERNAL=axios,lodash,moment,geopandas,shapely,rasterio,pyproj,sklearn
      - NODES_EXCLUDE=n8n-nodes-base.executeCommand
      - NODE_OPTIONS=${NODE_OPTIONS:-"--dns-result-order=ipv4first --max-old-space-size=4096"}

      # Configuration de sécurité
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-1a8c367948237c94ecf10f9cfa83f10bc6fa1944b4babe518c3196b0d0984d89}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-generate_secure_jwt_secret_for_production}
      - N8N_DIAGNOSTICS_ENABLED=false

      # Configuration géographique et localisation
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Ouagadougou}
      - TZ=${TZ:-Africa/Ouagadougou}
      - N8N_DEFAULT_LOCALE=fr

      # Configuration logging
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=console

      # Configuration spécifique géospatiale
      - GDAL_CACHEMAX=1024
      - GDAL_NUM_THREADS=ALL_CPUS
      - PROJ_NETWORK=ON
      - QT_QPA_PLATFORM=offscreen

      # Configuration performance
      - N8N_MEMORY_LIMIT_NORMAL=32
      - N8N_MEMORY_LIMIT_MAIN_PROCESS=512
      - N8N_CACHE_SIZE=100
      - N8N_BINARY_DATA_CACHE_SIZE=50
      - N8N_BINARY_DATA_MODE=filesystem
      # Configuration des fonctionnalités avancées
      - N8N_EXTERNAL_FRONTEND_HOOKS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_WORKFLOW_TAGS_ENABLED=true
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false

      # Configuration des timeouts pour les traitements géospatiaux intensifs
      - N8N_EXTERNAL_HOOKS_HTTP_NODES_TIMEOUT=${N8N_EXTERNAL_HOOKS_HTTP_NODES_TIMEOUT:-300}
      - N8N_EXTERNAL_HOOKS_HTTP_NODES_CONNECTION_TIMEOUT=${N8N_EXTERNAL_HOOKS_HTTP_NODES_CONNECTION_TIMEOUT:-300}
      - N8N_REQUEST_TIMEOUT=${N8N_REQUEST_TIMEOUT:-300000}
      - N8N_TASK_RUNNERS_TIMEOUT=${N8N_TASK_RUNNERS_TIMEOUT:-300}
      - ENABLE_AUTO_DEPLOY_WORKFLOWS=false
      - N8N_URL=${N8N_URL:-http://localhost:5678}
      # API protection (optional): define API_KEY to require x-api-key header on protected endpoints
      - API_KEY=${API_KEY:-}
    volumes:
      # Volumes pour les données de travail
      - ./files:/files
      - ./geodata:/geodata
      - ./workflows:/home/node/.n8n/workflows
      - ./init-scripts:/opt/init-scripts
      - ./scripts:/opt/geoscripts
      - /tmp/geodata-cache:/tmp/geodata-cache
    restart: unless-stopped
    depends_on:
      - postgis
      - redis
    networks:
      - n8n-network
    # Configuration des ressources pour les traitements géospatiaux intensifs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    # Configuration de santé pour le service
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5678/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Service MCP (Model-driven Co-pilot) pour l'invocation d'outils Python
  mcp-server:
    profiles:
      - dev
      - prod
    build: .
    container_name: mcp-server
    command: sh -c "PYTHONUNBUFFERED=1 python3 /opt/geoscripts/mcp_server.py || true && sleep infinity"
    ports:
      - "5001:5001"
    environment:
      - PGDATABASE=${POSTGRES_DB:-n8n}
      - PGUSER=geo
      - PGPASSWORD=geo_password
      - PGHOST=postgis
      - PGPORT=5432
    volumes:
      - ./scripts:/opt/geoscripts
      - /tmp/geodata-cache:/tmp/geodata-cache # Partage de cache avec n8n
    networks:
      - n8n-network
    restart: unless-stopped
    # Configuration des ressources pour le serveur MCP
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    # Configuration de santé pour le serveur MCP
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Base de données PostgreSQL avec extension PostGIS pour les opérations géospatiales
  postgis:
    profiles:
      - dev
      - prod
    image: postgis/postgis:15-3.4
    container_name: n8n-postgis
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8npassword}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
      # Configuration PostGIS
      - POSTGRES_SHARED_PRELOAD_LIBRARIES=postgis
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - n8n-network
    # Configuration des ressources pour les opérations géospatiales
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    # Configuration de santé pour la base de données
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Service Redis pour la gestion des queues (nécessaire en production)
  redis:
    profiles:
      - dev
      - prod
    image: redis:7.2-alpine
    container_name: n8n-redis
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - n8n-network
    # Configuration des ressources
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    # Configuration de santé pour Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Service de proxy inverse optionnel pour la production (nginx)
  nginx:
    image: nginx:1.27-alpine
    profiles:
      - prod
    container_name: n8n-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - n8n-geospatial
    networks:
      - n8n-network
    # Configuration des ressources
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    # Configuration de santé pour nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  n8n-network:
    driver: bridge

volumes:
  postgis_data:
  redis_data:
